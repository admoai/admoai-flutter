# Runs on every PR and on pushes to main: format check, static analysis + tests
# for the SDK. Analyzer infos fail the build too (--fatal-infos).
#
# Flutter is pinned (FLUTTER_VERSION) so the format and lint gates cannot go red
# overnight because `stable` moved. Bump it on purpose, in its own PR, and run
# tool/format.sh with the new version in the same PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # tool/api.sh's extractor; bump on purpose and re-run tool/api.sh in the same PR.
  DART_APITOOL_VERSION: 0.23.2

jobs:
  sdk:
    name: Analyze & test (SDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The API check classifies a change against the merge base with origin/main.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The tag for pubspec.yaml's version will be released with its CHANGELOG.md section
      # (publish.yml); catch a missing section on the release PR, not after the tag.
      - name: Release notes exist for pubspec.yaml's version
        run: tool/release_notes.sh > /dev/null

      # Fix locally with tool/format.sh.
      - name: Format
        run: tool/format.sh --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Public API baseline (api/admoai.api.txt). Red = the API changed and the baseline was
      # not regenerated; the log and the job summary say which changes are breaking.
      - name: Public API check
        run: |
          dart pub global activate dart_apitool "$DART_APITOOL_VERSION" > /dev/null
          export PATH="$PATH:$HOME/.pub-cache/bin"
          tool/api.sh --check

      # Deterministic gate only. `live` tests hit api.mock.admoai.com and soft-log some API
      # errors instead of failing; `e2e` needs a locally-running, seeded decision-engine and is
      # driven through tool/journey_e2e.sh. Both are documented as excluded in dart_test.yaml —
      # this workflow predates those tags, so a bare `flutter test` would run them and fail (or
      # worse, pass while asserting nothing).
      - name: Test (deterministic unit + mock suites)
        run: flutter test --exclude-tags "live || e2e"
