# Runs on every PR and on pushes to main: format check, static analysis + tests
# for the SDK. Analyzer infos fail the build too (--fatal-infos).
#
# Flutter is pinned (FLUTTER_VERSION) so the format and lint gates cannot go red
# overnight because `stable` moved. Bump it on purpose, in its own PR, and run
# tool/format.sh with the new version in the same PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  # tool/api.sh's extractor; bump on purpose and re-run tool/api.sh in the same PR.
  DART_APITOOL_VERSION: 0.23.2

jobs:
  # A pull request that changes only documentation skips the build and test jobs below.
  # They keep their names and report as skipped, which a ruleset reads as passing, so the
  # required checks never wait. The Scenario manifest job, push to main, workflow_dispatch
  # and the CodeQL / dependency scans are unfiltered. Fails open: a compare the API
  # refuses, or one at its 300-file cap, runs everything; so does a failed planner.
  changes:
    name: Plan the CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - name: Does the change touch anything but documentation?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: every job runs"; exit 0
          fi
          # A rename lists its old path too, so moving code into docs/ still runs the jobs.
          if ! compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
                 --jq '{n: (.files|length), f: [.files[] | .filename, (.previous_filename // empty)]}')"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "::warning::compare API failed: every job runs"; exit 0
          fi
          if [ "$(jq '.n' <<<"$compare")" -ge 300 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "300+ files changed: every job runs"; exit 0
          fi
          is_doc() {
            case "$1" in
            # The SDK job checks CHANGELOG.md has a section for pubspec.yaml's version.
            CHANGELOG.md) return 1 ;;
            docs/*|*.md|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            *) return 1 ;;
            esac
          }
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if is_doc "$f"; then echo "  docs: $f"; else echo "  code: $f"; code=true; fi
          done < <(jq -r '.f[]' <<<"$compare")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then echo "code changed: every job runs"; else echo "documentation only: build and test jobs skipped"; fi

  sdk:
    name: Analyze & test (SDK)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The API check classifies a change against the merge base with origin/main.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The tag for pubspec.yaml's version will be released with its CHANGELOG.md section
      # (publish.yml); catch a missing section on the release PR, not after the tag.
      - name: Release notes exist for pubspec.yaml's version
        run: tool/release_notes.sh > /dev/null

      # Fix locally with tool/format.sh.
      - name: Format
        run: tool/format.sh --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Public API baseline (api/admoai.api.txt). Red = the API changed and the baseline was
      # not regenerated; the log and the job summary say which changes are breaking.
      - name: Public API check
        run: |
          dart pub global activate dart_apitool "$DART_APITOOL_VERSION" > /dev/null
          export PATH="$PATH:$HOME/.pub-cache/bin"
          tool/api.sh --check

      # Deterministic gate only. `live` tests hit api.mock.admoai.com and soft-log some API
      # errors instead of failing; `e2e` needs a locally-running, seeded decision-engine and is
      # driven through tool/journey_e2e.sh. Both are documented as excluded in dart_test.yaml —
      # this workflow predates those tags, so a bare `flutter test` would run them and fail (or
      # worse, pass while asserting nothing).
      - name: Test (deterministic unit + mock suites)
        run: flutter test --exclude-tags "live || e2e"

  # The shared scenario manifest is vendored from adhub's @admoai/sdk-scenarios package
  # (admoai/adhub#4158): the bytes must be exactly the version MANIFEST_VERSION names, so a
  # scenario edited here instead of in adhub fails this repo's own PR. A newer published
  # version is a warning. The only CI step that reads the registry; the tests never do.
  scenarios:
    name: Scenario manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The check script's own tests
        run: .github/scripts/scenarios_test.sh
      - name: test/e2e/scenarios.json is the published version it names
        run: .github/scripts/scenarios.sh check test/e2e/scenarios.json
