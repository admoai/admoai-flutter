# Known-vulnerability scan of the resolved dependency graph, on every PR, on main and
# weekly (new advisories appear against unchanged constraints). CodeQL has no Dart support,
# so this is the Flutter counterpart of the CodeQL job on the iOS/Android SDKs.
#
# The package does not commit a lockfile (it is a library), so the job resolves one — the
# graph an integrator gets today from these constraints — and scans that.
name: Dependency scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV scan (pub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve the dependency graph
        run: flutter pub get

      - name: Scan pubspec.lock
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock
