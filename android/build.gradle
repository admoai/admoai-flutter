group 'com.admoai.flutter'
version '1.0-SNAPSHOT'

// Toolchain levels deliberately mirror device_info_plus 11.x (Kotlin 1.7.22, AGP 8.3.1) so that
// adding this plugin never raises what a host app already needs to build. minSdk is the exception:
// device_info_plus declares 19, but androidx.webkit 1.12.1 requires 21, which is also the documented
// minimum and the default of Flutter 3.27, our floor.
buildscript {
    ext.kotlin_version = '1.7.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.admoai.flutter'

    // 35, not device_info_plus's 34: flutter_timezone 4.1.x (already a dependency of this package)
    // declares minCompileSdk 35 in its AAR metadata, so every module that depends on it must compile
    // against 35. compileSdk is not a runtime floor: minSdk is 21, and host apps already need 35
    // because of flutter_timezone.
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    // The Lead Generation secure form view: a message listener bound to one origin, and the
    // WebView profile. Same version as the native Android SDK.
    implementation 'androidx.webkit:webkit:1.12.1'

    testImplementation 'junit:junit:4.13.2'
    // Test only: the form view's settings and listener rules run on a JVM WebView shadow.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
