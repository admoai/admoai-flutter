# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration — the SDK-relevant subset of adhub's
# .coderabbit.yaml (see that file for the reasoning behind each key). Every key
# was checked by hand against https://docs.coderabbit.ai/reference/yaml-template:
# CodeRabbit ignores unknown keys silently, so a typo fails open.
#
# After changing this file, confirm the next walkthrough says
# "Configuration used: Repository YAML".

language: en-US

reviews:
  profile: chill
  # ONE REVIEW PER PR, as in admoai/adhub (admoai/adhub#4756): every PR is reviewed once,
  # automatically, and pushes after that do not re-review it. A draft is not reviewed (the
  # default) until it is marked ready; a second review is a deliberate `@coderabbitai review`.
  auto_review:
    enabled: true
    # The automation bot's PRs (scenario adoptions) are never reviewed: CodeRabbit refuses a bot
    # without its own paid seat and posted a "Review skipped" notice on each one. They change one
    # line that the required "Scenario manifest" check already proves (admoai/adhub#4661).
    ignore_usernames: ["adhub-automation[bot]"]
    # Re-review on every push: off. This is what makes it one review per PR.
    auto_incremental_review: false
    # Lower than adhub's 5: SDK PRs are small, and a long re-review tail is cost
    # without signal. Resume with `@coderabbitai resume`.
    auto_pause_after_reviewed_commits: 3
    # Drafts are skipped by default (do not set `drafts: false` — it is already the default).

  # Generated, vendored or lock files: reviewing them costs a review and finds nothing.
  path_filters:
    - "!**/pubspec.lock"
    - "!**/Podfile.lock"
    - "!**/build/**"
    # Shared scenario manifest + its generated Gherkin (admoai/adhub#4158, #4348).
    - "!test/e2e/scenarios.feature"
    # Public API baseline (admoai/adhub#4347), regenerated by dart-apitool.
    - "!api/**"
